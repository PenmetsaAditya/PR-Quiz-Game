<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the PR</title>
<style>
:root{--bg:#EEF1F4;--ink:#1B2430;--muted:#5B6675;--line:#CDD4DC;--add:#1F7A4D;--add-bg:#E3F4EA;--del:#B3362F;--del-bg:#FBE6E4;--merge:#6E4BB8;--merge-bg:#EFEAF8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:2rem 1rem}
main{width:100%;max-width:640px}
h1{font-size:2.25rem;line-height:1.1;margin:0 0 .5rem}
p{margin:0 0 1rem;color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:.75rem 1rem;text-align:left;width:100%}
button:hover:not(:disabled){border-color:var(--merge)}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--merge);outline-offset:2px}
.levels{display:grid;gap:.5rem;margin-top:1.5rem}
.levels small{display:block;color:var(--muted)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.pr{background:#fff;border:1px solid var(--line);border-left:6px solid var(--merge);border-radius:6px;padding:1rem 1.25rem;margin:1rem 0 1.5rem;font:.95rem/1.6 ui-monospace,Menlo,Consolas,monospace}
.tag{display:inline-block;font:600 .8rem system-ui,sans-serif;color:var(--merge);background:var(--merge-bg);border-radius:4px;padding:.1rem .5rem;margin-bottom:.5rem}
.opts,.actions{display:grid;gap:.5rem}
.actions{margin-top:1rem}
.actions button{text-align:center}
.right{background:var(--add-bg);border-color:var(--add);color:var(--add)}
.wrong{background:var(--del-bg);border-color:var(--del);color:var(--del)}
.feedback{margin:1rem 0 0;padding:.75rem 1rem;border:1px solid;border-radius:6px}
.deep{margin-top:.75rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1rem 1.25rem}
.deep h3{font-size:1rem;margin:1.25rem 0 .25rem}
.deep h3:first-child{margin-top:0}
.deep p,.deep li,.deep dd{color:var(--ink);margin:0}
.deep ul{margin:0;padding-left:1.25rem}
.deep li{margin-bottom:.5rem}
.deep dt{font-weight:600;margin-top:.5rem}
.primary{background:var(--merge);border-color:var(--merge);color:#fff}
.note{margin:.75rem 0 0}
.big{font-size:4rem;font-weight:700;line-height:1;margin:1rem 0}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <section id="start">
    <h1>Read the PR</h1>
    <p>Each question is a pull request description. Pick what the change actually does.</p>
    <div class="levels">
      <button data-level="easy">Easy<small>Docs, tests, and obvious fixes</small></button>
      <button data-level="medium">Medium<small>Refactors, config, and new features</small></button>
      <button data-level="hard">Hard<small>Security and risky dependency changes</small></button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="meta"><span id="progress"></span><span id="score"></span></div>
    <div class="pr"><span class="tag" id="topic"></span><div id="desc"></div></div>
    <div class="opts" id="opts"></div>
    <div class="feedback hidden" id="feedback"></div>
    <div class="deep hidden" id="deep"></div>
    <p class="note" id="note"></p>
    <div class="actions">
      <button class="hidden" id="similar">Try a similar question</button>
      <button class="primary hidden" id="next"></button>
    </div>
  </section>

  <section id="end" class="hidden">
    <h1>Round complete</h1>
    <div class="big" id="final"></div>
    <p id="verdict"></p>
    <button class="primary" id="again" style="text-align:center">Play again</button>
  </section>
</main>

<script src="questions.js"></script>
<script>
const ROUND_SIZE = 10;
const $ = id => document.getElementById(id);
let round = [], i = 0, score = 0;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function shuffle(list) {
  const a = [...list];
  for (let j = a.length - 1; j > 0; j--) {
    const k = Math.floor(Math.random() * (j + 1));
    [a[j], a[k]] = [a[k], a[j]];
  }
  return a;
}

function show(id) {
  for (const s of ['start', 'quiz', 'end']) $(s).classList.toggle('hidden', s !== id);
}

function start(level) {
  if (typeof QUESTIONS === 'undefined') return alert('questions.js is missing. Keep it in the same folder as index.html.');
  round = shuffle(QUESTIONS.filter(q => q.difficulty === level)).slice(0, ROUND_SIZE);
  if (!round.length) return alert('No questions for this level yet.');
  i = 0; score = 0;
  show('quiz');
  render();
}

function render() {
  const q = round[i];
  $('progress').textContent = `Question ${i + 1} of ${round.length}`;
  $('score').textContent = `Score ${score}`;
  $('topic').textContent = q.topic;
  $('desc').textContent = q.prDescription;
  $('note').textContent = '';
  for (const id of ['feedback', 'deep', 'similar', 'next']) $(id).classList.add('hidden');
  $('opts').replaceChildren();
  shuffle(q.options.map((text, idx) => ({ text, ok: idx === q.correctIndex }))).forEach(o => {
    const b = el('button', o.text);
    b.dataset.ok = o.ok;
    b.onclick = () => answer(b, o.ok, q);
    $('opts').append(b);
  });
}

function answer(picked, ok, q) {
  for (const b of $('opts').children) {
    b.disabled = true;
    if (b.dataset.ok === 'true') b.classList.add('right');
  }
  if (ok) score++; else { picked.classList.add('wrong'); deepDive(q, picked.textContent); }
  $('feedback').className = 'feedback ' + (ok ? 'right' : 'wrong');
  $('feedback').textContent = (ok ? 'Correct. ' : 'Not quite. ') + q.explanation;
  $('score').textContent = `Score ${score}`;
  $('next').textContent = i + 1 < round.length ? 'Next question' : 'See results';
  $('similar').classList.remove('hidden');
  $('next').classList.remove('hidden');
  $('next').focus();
}

function deepDive(q, pickedText) {
  const d = q.deepExplanation;
  const wrongOptions = q.options.filter((_, k) => k !== q.correctIndex);
  const list = el('ul');
  wrongOptions.forEach((opt, k) => {
    const li = el('li');
    li.append(el('strong', opt + (opt === pickedText ? ' (your answer)' : '')), el('br'), d.whyWrong[k] || '');
    list.append(li);
  });
  const terms = el('dl');
  d.keyTerms.forEach(t => terms.append(el('dt', t.term), el('dd', t.meaning)));
  $('deep').replaceChildren(
    el('h3', 'What the right answer means'), el('p', d.correct),
    el('h3', 'Why the other options are wrong'), list,
    ...(d.keyTerms.length ? [el('h3', 'Key terms'), terms] : [])
  );
  $('deep').classList.remove('hidden');
}

function similar() {
  const q = round[i];
  const seen = round.slice(0, i + 1).map(x => x.id);
  const pool = QUESTIONS.filter(x => x.difficulty === q.difficulty && x.topic === q.topic && !seen.includes(x.id));
  if (!pool.length) {
    $('note').textContent = `That's every ${q.topic} question at this level for now. Carry on with the round.`;
    $('similar').classList.add('hidden');
    return;
  }
  const pick = shuffle(pool)[0];
  round = round.filter(x => x.id !== pick.id);
  round.splice(i + 1, 0, pick);
  i++;
  render();
}

function finish() {
  const pct = score / round.length;
  $('final').textContent = `${score} / ${round.length}`;
  $('verdict').textContent = pct === 1 ? 'Every PR read correctly.'
    : pct >= 0.7 ? 'Solid reviewing. Try the next level up.'
    : 'Worth another round at this level.';
  show('end');
}

$('next').onclick = () => { i++; i < round.length ? render() : finish(); };
$('similar').onclick = similar;
$('again').onclick = () => show('start');
document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => start(b.dataset.level));
</script>
</body>
</html>
